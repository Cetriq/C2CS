# credit-service.c2cs.yaml — worked example of a C2CS semantic model, schema v0.1
# Illustrates all three provenance sources and both tiers. See ../c2cs-schema-v0.1.md.

c2cs: "0.1"

subject:
  name: credit-service
  type: service                    # service | library | binary | repository
  source:
    repository: https://github.com/acme/credit-service
    revision: 4f2a91c
  artifacts:
    - path: bin/CreditService.dll
      digest: sha256:9b1f6c…      # binds claims to a concrete artifact
  sbom: sbom/credit-service.cdx.json   # composition lives in the SBOM, not here

contract:
  mode: closed                     # closed = anything not declared is forbidden (least privilege)
                                   # open   = undeclared behavior is unknown, not a violation

# ─────────────────────────────────────────────────────────────────────
# Tier 1 — verifiable core
# Claims that can be mechanically compared against observed behavior.
# ─────────────────────────────────────────────────────────────────────

capabilities:
  network:
    - id: cap.net.db
      direction: outbound
      host: db.internal.acme.example
      port: 5432
      protocol: postgres
      provenance:
        source: declared
        by: claes@acme.example
        date: 2026-07-28

    - id: cap.net.audit
      direction: outbound
      host: audit.internal.acme.example
      port: 443
      protocol: https
      provenance:
        source: observed
        evidence: c2cs-trace://run-2026-07-27/net#1042
        first_seen: 2026-07-26
        last_seen: 2026-07-28

  filesystem:
    - id: cap.fs.applog
      path: /var/log/credit-service/
      access: write
      provenance:
        source: declared
        by: claes@acme.example
        date: 2026-07-28

  process: []                      # under closed mode, an empty list is itself a claim:
                                   # this service spawns no subprocesses

forbidden:
  # Normative prohibitions. Always declared — a prohibition is a decision, never an inference.
  - id: forb.net.external
    capability: network
    scope: "any host outside *.internal.acme.example"
    rationale: Customer data must not leave the internal zone.
    provenance:
      source: declared
      by: claes@acme.example
      date: 2026-07-28

# ─────────────────────────────────────────────────────────────────────
# Tier 2 — semantic annotations
# Business meaning. Not mechanically verifiable; never treated as evidence.
# ─────────────────────────────────────────────────────────────────────

operations:
  - id: op.customer.credit.evaluate
    summary: Evaluates a customer's creditworthiness and records the decision.
    reads: [Customer, CreditHistory]
    writes: [CreditDecision]
    uses: [cap.net.db, cap.net.audit, cap.fs.applog]   # links down to tier 1
    provenance:
      source: inferred
      model: claude-fable-5
      confidence: 0.86
      status: pending-approval     # approval promotes this claim to declared

data:
  entities:
    - name: Customer
      classification: personal-data
      provenance:
        source: declared
        by: claes@acme.example
        date: 2026-07-28
    - name: CreditDecision
      classification: personal-data
      provenance:
        source: inferred
        model: claude-fable-5
        confidence: 0.91
        status: pending-approval
  flows:
    - from: Customer
      to: CreditDecision
      via: op.customer.credit.evaluate
      provenance:
        source: inferred
        model: claude-fable-5
        confidence: 0.83
        status: pending-approval
